<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quelio — Super Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/css/superadmin.css">
</head>
<body>

<!-- ═══════════ LOGIN VIEW ═══════════ 
 A centered login card with brand logo, username/password fields, a hidden error message, 
 and a submit button that starts disabled ("Connecting to Firebase…") until Firebase is ready, 
 then calls doLogin().-->
<div id="login-view" class="login-view">
  <div class="login-card">
    <div class="login-brand">
      <img src="/assets/quelio-small1.png" alt="Quelio" class="login-logo" onerror="this.style.display='none'">
      <div class="login-brand-text">Quel<em>io</em></div>
    </div>
    <div class="login-tag">Super Admin Console</div>
    <!--<p class="login-sub">Sign in to manage admin accounts and view system-wide reports.</p>-->

    <div class="login-field">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="Super admin username" autocomplete="username">
    </div>
    <div class="login-field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div class="login-error" id="login-error">Incorrect username or password.</div>
    <button class="login-btn" id="login-submit-btn" onclick="doLogin()" disabled>Connecting to Firebase…</button>
    <!--<div class="login-hint">Seed super admin login — <b>superadmin</b> / <b>super1234</b><br>Stored in Firebase under <code>superAdmins</code>; change the password there once you're in.</div>-->
  </div>
</div>

<!-- ═══════════ DASHBOARD VIEW ═══════════ 
  A hidden-until-login main console with a top nav and a two-tab layout 
  "Analytics & Reports" (default) and "Admin Accounts" — toggled client-side via switchTab().-->
<div id="dash-view" class="dash-view" style="display:none;">

  <nav id="topnav">
    <div class="nav-brand">
      <img src="/assets/quelio-small1.png" alt="Quelio" style="height:26px;width:auto;display:block;" onerror="this.style.display='none'">
      <span class="nav-admin-tag">Super Admin</span>
    </div>
    <div class="nav-actions">
      <a class="tv-link-btn" href="/tv" target="_blank" rel="noopener noreferrer"><span class="tv-link-dot"></span> TV Display</a>
      <a class="tv-link-btn" href="/kiosk" target="_blank" rel="noopener noreferrer"><span class="tv-link-dot"></span> Kiosk</a>
      <div class="user-chip">
        <div class="online-dot"></div>
        <!--<span id="admin-user-lbl">Super Admin</span>-->
      </div>
      <button class="logout-btn" onclick="doLogout()">Log Out</button>
    </div>
  </nav>

  <div class="tabbar">
    <button class="tab-btn active" data-tab="overview" onclick="switchTab('overview')">Analytics &amp; Reports</button>
    <button class="tab-btn" data-tab="admins" onclick="switchTab('admins')">Admin Accounts</button>
  </div>

  <!-- ── TAB: ANALYTICS / REPORTS ── 
   The "Analytics & Reports" tab shows a header with a Today/Week/Month range dropdown that triggers refreshAnalytics(), 
   an empty #kpi-row for overall KPI cards, and an empty #dept-report-grid for per-department breakdown cards-->
  <div class="tab-panel active" id="tab-overview">

    <div class="panel-header">
      <div>
        <h2>System Analytics</h2>
        <p id="today-label">Today — —</p>
      </div>
      <div class="panel-header-actions">
        <select id="range-select" class="range-select" onchange="refreshAnalytics()">
          <option value="today" selected>Today</option>
          <option value="week">This Week</option>
          <option value="month">This Month</option>
        </select>
        <!--<span class="mock-pill">Live data from Firebase</span>-->
      </div>
    </div>

    <!-- Overall KPI cards -->
    <div class="kpi-row" id="kpi-row"></div>

    <!-- Per-department breakdown -->
    <div class="dept-report-grid" id="dept-report-grid"></div>

  </div>

  <!-- ── TAB: ADMIN ACCOUNTS ── 
   The "Admin Accounts" tab lists admins in a table (Status, Username, Department, Window, Role, actions) with JS-rendered rows, 
   a "+ Add Admin" button that opens a modal form (username, temp password, department, window, role) submitting via submitAddAdmin(), 
   and a backdrop click or Cancel closing it via closeAddAdminModal().-->
  <div class="tab-panel" id="tab-admins">

    <div class="panel-header">
      <div>
        <h2>Admin Accounts</h2>
        <p>Add or remove staff profiles for Registrar, Accounting, and Scholarship &amp; Grants windows.</p>
      </div>
      <div class="panel-header-actions">
        <button class="primary-btn" onclick="openAddAdminModal()">+ Add Admin</button>
      </div>
    </div>

    <div class="admins-table-wrap">
      <table class="admins-table">
        <thead>
          <tr>
            <th>Status</th>
            <th>Username</th>
            <th>Department</th>
            <th>Window</th>
            <th>Role</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="admins-tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<!-- ═══════════ ADD ADMIN MODAL ═══════════ -->
<div class="modal-backdrop" id="add-admin-backdrop" onclick="closeAddAdminModal(event)">
  <div class="modal-card" onclick="event.stopPropagation()">
    <div class="modal-title">Add Admin Profile</div>
    <div class="modal-field">
      <label>Username / Display Name</label>
      <input type="text" id="new-admin-user" placeholder="e.g. Registrar Window 4">
    </div>
    <div class="modal-field">
      <label>Temporary Password</label>
      <input type="text" id="new-admin-pass" placeholder="e.g. reg4pass">
    </div>
    <div class="modal-row">
      <div class="modal-field">
        <label>Department</label>
        <select id="new-admin-dept">
          <option value="registrar">Registrar</option>
          <option value="accounting">Accounting Office</option>
          <option value="scholarship">Scholarship &amp; Grants</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Window Number</label>
        <select id="new-admin-window"></select>
      </div>
    </div>
    <div class="modal-field">
      <label>Role</label>
      <input type="text" id="new-admin-role" placeholder="Staff" value="Staff">
    </div>
    <div class="modal-actions">
      <button class="ghost-btn" onclick="closeAddAdminModal()">Cancel</button>
      <button class="primary-btn" onclick="submitAddAdmin()">Add Admin</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script type="module" src="/admin/scripts/superadmin.js"></script>
</body>
</html>
